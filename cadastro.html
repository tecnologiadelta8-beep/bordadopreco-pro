<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f4d">
  <meta name="robots" content="noindex, nofollow">
  <title>Cadastro | JDC Tecnologia em Bordados</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1f4d 0%, #1a3a6e 50%, #0f2a5a 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .card h1 {
      font-size: 1.4rem;
      color: #0a1f4d;
      text-align: center;
      margin-bottom: 6px;
    }
    .card .sub {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #0a1f4d;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2a5a9e;
      box-shadow: 0 0 0 4px rgba(42,90,158,0.12);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: #0a1f4d;
      color: #fff;
    }
    .btn-primary:hover { background: #1a3a6e; }
    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
    }
    .links a { color: #2a5a9e; font-weight: 600; text-decoration: none; }
    .msg {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
    }
    .msg.show { display: block; }
    .msg.ok { background: #f0fdf4; color: #166534; }
    .msg.err { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Criar conta</h1>
    <p class="sub">Cadastro de Cliente — JDC Tecnologia em Bordados</p>

    <div class="msg" id="msg"></div>

    <form id="formCadastro">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="nome" required placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="tel" id="telefone" required placeholder="(65) 9XXXX-XXXX">
      </div>
      <div class="form-group">
        <label>Data de nascimento</label>
        <input type="text" id="nascimento" maxlength="10" placeholder="dd/mm/aaaa" required>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Criar senha</label>
        <input type="password" id="senha" required minlength="4" placeholder="Mínimo 4 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" id="senha2" required placeholder="Repita a senha">
      </div>

      <button type="submit" class="btn btn-primary" id="btnSalvar">
        <i class="fas fa-user-plus"></i> Cadastrar
      </button>
    </form>

    <div class="links">
      <p>Já tem conta? <a href="login.html">Entrar</a></p>
      <p style="margin-top:10px;"><a href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // Máscara data
    document.getElementById('nascimento').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4);
      else if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
      this.value = v;
    });

    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + (ok ? 'ok' : 'err');
    }

    document.getElementById('formCadastro').addEventListener('submit', async function (e) {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const nascimento = document.getElementById('nascimento').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;
      const btn = document.getElementById('btnSalvar');

      if (senha !== senha2) {
        showMsg('As senhas não coincidem.', false);
        return;
      }
      if (senha.length < 4) {
        showMsg('A senha precisa ter pelo menos 4 caracteres.', false);
        return;
      }

      // Converte data dd/mm/aaaa → yyyy-mm-dd
      let dataNasc = null;
      const m = nascimento.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) dataNasc = m[3] + '-' + m[2] + '-' + m[1];

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

      try {
        if (typeof initSupabase === 'function') initSupabase();
        if (!window.supabase) throw new Error('Sem conexão com o banco');

        // Verifica se já existe
        const { data: existe } = await supabase
          .from('clientes')
          .select('id')
          .or(`email.ilike.${email},telefone.ilike.%${telefone.replace(/\D/g,'')}%`)
          .maybeSingle();

        if (existe) {
          showMsg('Já existe um cadastro com este e-mail ou telefone. Faça login.', false);
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-user-plus"></i> Cadastrar';
          return;
        }

        const { error } = await supabase.from('clientes').insert({
          nome,
          email,
          telefone,
          whatsapp: telefone,
          senha,
          data_nascimento: dataNasc
        });

        if (error) throw error;

        showMsg('Cadastro realizado com sucesso! Redirecionando para o login...', true);
        setTimeout(() => window.location.href = 'login.html', 1800);
      } catch (err) {
        console.error(err);
        showMsg('Não foi possível cadastrar. Tente novamente ou fale no WhatsApp.', false);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Cadastrar';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f4d">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Gestor | JDC Tecnologia em Bordados</title>
  
  <link rel="manifest" href="manifest-gestor.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1f4d 0%, #1a3a6e 50%, #0f2a5a 100%);
      padding: 20px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #f5c518;
      margin-bottom: 16px;
      object-fit: cover;
    }
    .login-header h1 {
      font-size: 1.5rem;
      color: #0a1f4d;
      margin-bottom: 6px;
    }
    .login-header p {
      color: #64748b;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #0a1f4d;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2a5a9e;
      box-shadow: 0 0 0 4px rgba(42,90,158,0.15);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #f5c518;
      color: #0a1f4d;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #d4a80f;
      transform: translateY(-2px);
    }
    .login-error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }
    .login-error.show { display: block; }
    .back-link {
      text-align: center;
      margin-top: 24px;
    }
    .back-link a {
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .back-link a:hover { color: #f5c518; }
    .pwa-hint {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="icon-192.png" alt="JDC">
        <h1>Área do Gestor</h1>
        <p>JDC Tecnologia em Bordados</p>
      </div>

      <div class="login-error" id="login-error">
        Usuário ou senha incorretos
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Usuário</label>
          <input type="text" id="username" name="username" placeholder="Digite o usuário" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Senha</label>
          <input type="password" id="password" name="password" placeholder="Digite a senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>
    </div>

    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    </div>
    <p class="pwa-hint">PWA do Gestor — instale no celular para acesso rápido</p>
  </div>

  <script src="auth.js"></script>
  <script>
    // Se já estiver logado, redireciona
    if (isGestorLoggedIn()) {
      window.location.href = 'admin.html';
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');

      if (loginGestor(user, pass)) {
        window.location.href = 'admin.html';
      } else {
        errorEl.classList.add('show');
        setTimeout(() => errorEl.classList.remove('show'), 3000);
      }
    });
  </script>
</body>
</html>
